name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and build Apple Silicon + Intel
        run: bash Scripts/build.sh
      - name: Verify bundle and both architectures
        run: |
          codesign --verify --strict 'build/Ads Recovery.app'
          architectures=$(lipo -archs 'build/Ads Recovery.app/Contents/MacOS/AdsRecovery')
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
      - name: Upload app and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ads-Recovery-macOS
          path: |
            build/Ads-Recovery-macOS.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
